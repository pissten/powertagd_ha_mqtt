[supervisord]
nodaemon=true
user=root

[program:powertagd]
command=/usr/local/bin/powertagd -o mqtt --host %(ENV_MQTT_HOST)s --port %(ENV_MQTT_PORT)s -d %(ENV_SERIAL_DEV)s %(ENV_EXTRA_ARGS)s
autostart=true
autorestart=true
startsecs=5
startretries=100
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:discovery]
command=python3 /app/ha_discovery.py
autostart=true
autorestart=true
startsecs=5
startretries=100
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
